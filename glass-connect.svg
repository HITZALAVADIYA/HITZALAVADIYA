<svg width="900" height="320" viewBox="0 0 900 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0c29"/>
      <stop offset="45%" stop-color="#302b63"/>
      <stop offset="100%" stop-color="#24243e"/>
    </linearGradient>

    <radialGradient id="blob1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00c7b7" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#00c7b7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blob2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff5f6d" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ff5f6d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blob3" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7f5fff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#7f5fff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blob4" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd166" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ffd166" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="glassFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.06"/>
    </linearGradient>
    <linearGradient id="btnFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.10"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <filter id="blurBig" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#000000" flood-opacity="0.35"/>
    </filter>

    <clipPath id="frame">
      <rect x="0" y="0" width="900" height="320" rx="28"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="900" height="320" fill="url(#bg)"/>
    <circle cx="120" cy="60" r="160" fill="url(#blob1)" filter="url(#blurBig)"/>
    <circle cx="780" cy="40" r="180" fill="url(#blob2)" filter="url(#blurBig)"/>
    <circle cx="700" cy="280" r="170" fill="url(#blob3)" filter="url(#blurBig)"/>
    <circle cx="180" cy="300" r="150" fill="url(#blob4)" filter="url(#blurBig)"/>

    <rect x="50" y="40" width="800" height="240" rx="32"
          fill="url(#glassFill)" stroke="#ffffff" stroke-opacity="0.35" stroke-width="1.2"
          filter="url(#softShadow)"/>
    <path d="M 66 55 Q 450 20 834 55 L 834 90 Q 450 60 66 90 Z" fill="url(#sheen)" opacity="0.5"/>

    <text x="450" y="105" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif"
          font-size="30" font-weight="700" fill="#ffffff">Let's Connect</text>
    <text x="450" y="132" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif"
          font-size="14" fill="#e6e6f0" opacity="0.85">Always open for collaborations &amp; new ideas</text>

    <!-- LinkedIn button -->
    <g transform="translate(95,175)">
      <rect width="220" height="66" rx="20" fill="url(#btnFill)" stroke="#ffffff" stroke-opacity="0.4" stroke-width="1"/>
      <circle cx="42" cy="33" r="17" fill="#0A66C2" opacity="0.9"/>
      <text x="42" y="39" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff">in</text>
      <text x="128" y="30" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#ffffff">LinkedIn</text>
      <text x="128" y="48" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" fill="#dcdcf0" opacity="0.8">Let's link up</text>
    </g>

    <!-- Gmail button -->
    <g transform="translate(340,175)">
      <rect width="220" height="66" rx="20" fill="url(#btnFill)" stroke="#ffffff" stroke-opacity="0.4" stroke-width="1"/>
      <circle cx="42" cy="33" r="17" fill="#EA4335" opacity="0.9"/>
      <path d="M 33 27 L 42 34 L 51 27" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="33" y="26" width="18" height="14" rx="2" fill="none" stroke="#ffffff" stroke-width="2"/>
      <text x="128" y="30" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#ffffff">Email</text>
      <text x="128" y="48" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" fill="#dcdcf0" opacity="0.8">Drop a line</text>
    </g>

    <!-- Portfolio button -->
    <g transform="translate(585,175)">
      <rect width="220" height="66" rx="20" fill="url(#btnFill)" stroke="#ffffff" stroke-opacity="0.4" stroke-width="1"/>
      <circle cx="42" cy="33" r="17" fill="#00C7B7" opacity="0.9"/>
      <path d="M 33 38 L 40 27 L 45 33 L 51 24" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="128" y="30" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#ffffff">Portfolio</text>
      <text x="128" y="48" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" fill="#dcdcf0" opacity="0.8">See my work</text>
    </g>
  </g>
</svg>
